<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elwazer TV</title>

  <!-- مشغل Plyr الحديث -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #07080b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 25px;
    }

    /* الهيدر الموسع */
    header {
      width: 100%;
      max-width: 1450px;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a1d29;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.7rem;
      color: #00e676;
      letter-spacing: 0.5px;
    }

    .brand-tag {
      background: #141722;
      border: 1px solid #232738;
      padding: 5px 12px;
      border-radius: 20px;
      color: #00e676;
      font-size: 0.85rem;
      font-weight: 600;
    }

    /* الحاوية الرئيسية (شاشة سينمائية عريضة) */
    .container {
      width: 100%;
      max-width: 1450px;
      display: grid;
      grid-template-columns: 1fr 280px; /* إعطاء المشغل المساحة الأكبر */
      gap: 25px;
      align-items: start;
    }

    @media (max-width: 992px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* قسم مشغل الفيديو الفخم */
    .video-section {
      background: #10121a;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #1e2230;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7);
    }

    .video-wrapper {
      position: relative;
      background: #000;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* شريط العنوان أسفل الفيديو بعد حذف الأزرار */
    .video-info {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, #10121a 0%, #0c0e15 100%);
      border-top: 1px solid #1c202c;
    }

    .video-info h2 {
      font-size: 1.3rem;
      color: #ffffff;
      font-weight: 600;
    }

    .now-playing-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.1);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .now-playing-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 8px #00e676;
    }

    /* قسم قائمة الحلقات الجانبي */
    .episodes-section {
      background: #10121a;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid #1e2230;
      max-height: 640px;
    }

    .episodes-section h3 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #aaa;
      border-bottom: 1px solid #1e2230;
      padding-bottom: 10px;
    }

    /* شبكة الحلقات */
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding-left: 5px;
    }

    .episodes-grid::-webkit-scrollbar {
      width: 5px;
    }
    .episodes-grid::-webkit-scrollbar-thumb {
      background: #252a3b;
      border-radius: 4px;
    }

    .episode-btn {
      background: #171a26;
      border: 1px solid #23283b;
      color: #cfd3e0;
      padding: 12px 6px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      user-select: none;
    }

    .episode-btn:hover {
      background: #222738;
      color: #fff;
      transform: translateY(-2px);
    }

    .episode-btn.active {
      background: #00e676;
      color: #07080b;
      font-weight: bold;
      border-color: #00e676;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.25);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="series-title">اسم المسلسل</h1>
    <span class="brand-tag">Elwazer Cinema HD</span>
  </header>

  <div class="container">
    
    <!-- مشغل الفيديو السينمائي -->
    <div class="video-section">
      <div class="video-wrapper">
        <video id="player" playsinline controls></video>
      </div>

      <div class="video-info">
        <h2 id="current-episode-text">اختر حلقة للتشغيل</h2>
        <span class="now-playing-badge">جاري المشاهدة</span>
      </div>
    </div>

    <!-- قائمة الحلقات -->
    <div class="episodes-section">
      <h3>قائمة الحلقات</h3>
      <div class="episodes-grid" id="episodes-container"></div>
    </div>

  </div>

  <!-- مكتبة المشغل Plyr -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    /* ========================================================
       بيانات المسلسل والحلقات
       ======================================================== */
    const SERIES_NAME = "مسلسل lioness - الموسم الأول";

    const EPISODES = [
      {
        number: 1,
        title: "الحلقة 1",
        url: "http://shoftv.net:80/series/277468210/118457482/206784.mkv"
      },
      {
        number: 2,
        title: "الحلقة 2",
        url: "http://shoftv.net:80/series/277468210/118457482/206785.mkv"
      },
      {
        number: 3,
        title: "الحلقة 3",
        url: "http://shoftv.net:80/series/277468210/118457482/206786.mkv"
      },
      {
        number: 4,
        title: "الحلقة 4",
        url: "http://shoftv.net:80/series/277468210/118457482/206787.mkv"
      },
      {
        number: 5,
        title: "الحلقة 5",
        url: "http://shoftv.net:80/series/277468210/118457482/207465.mkv"
      },
      {
        number: 6,
        title: "الحلقة 6",
        url: "http://shoftv.net:80/series/277468210/118457482/264183.mkv"
      },
      {
        number: 7,
        title: "الحلقة 7",
        url: "http://shoftv.net:80/series/277468210/118457482/207625.mkv"
      },
      {
        number: 8,
        title: "الحلقة 8",
        url: "http://shoftv.net:80/series/277468210/118457482/207831.mkv"
      }
    ];

    /* ========================================================
       كود التشغيل مع البروكسي
       ======================================================== */
    document.getElementById('series-title').innerText = SERIES_NAME;

    const videoElement = document.getElementById('player');
    const episodeTitleEl = document.getElementById('current-episode-text');
    const episodesContainer = document.getElementById('episodes-container');

    const player = new Plyr(videoElement, {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
    });

    function playEpisode(episode) {
      episodeTitleEl.innerText = `${SERIES_NAME} - ${episode.title}`;

      // الرابط عبر Cloudflare Worker
      const proxiedUrl = `https://wazer.wazermasr22.workers.dev/?url=${encodeURIComponent(episode.url)}`;

      player.source = {
        type: 'video',
        title: episode.title,
        sources: [
          {
            src: proxiedUrl,
            type: 'video/mp4',
          }
        ]
      };

      player.play().catch(e => {
        console.log("في انتظار بدء التشغيل...");
      });
    }

    // إنشاء أزرار الحلقات
    function renderEpisodes() {
      episodesContainer.innerHTML = '';
      EPISODES.forEach((ep, index) => {
        const btn = document.createElement('div');
        btn.className = 'episode-btn' + (index === 0 ? ' active' : '');
        btn.innerText = ep.title;

        btn.addEventListener('click', () => {
          document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          playEpisode(ep);
        });

        episodesContainer.appendChild(btn);
      });

      if (EPISODES.length > 0) {
        playEpisode(EPISODES[0]);
      }
    }

    renderEpisodes();
  </script>
</body>
</html>
