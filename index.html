<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elwazer TV</title>

  <!-- مشغل Plyr الحديث -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    header {
      width: 100%;
      max-width: 1200px;
      padding: 15px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f222e;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.6rem;
      color: #00e676;
    }

    .container {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* قسم مشغل الفيديو */
    .video-section {
      background: #14161f;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .video-wrapper {
      position: relative;
      background: #000;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
    }

    .video-info {
      padding: 15px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .video-info-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .video-info h2 {
      font-size: 1.2rem;
      color: #ffffff;
    }

    .actions-btns {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      color: white;
      text-decoration: none;
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
      transition: 0.2s;
    }

    .vlc-btn {
      background: #e65100;
    }
    .vlc-btn:hover {
      background: #f57c00;
    }

    .copy-btn {
      background: #2b3147;
    }
    .copy-btn:hover {
      background: #3b4360;
    }

    .alert-box {
      background: rgba(255, 152, 0, 0.1);
      border: 1px solid rgba(255, 152, 0, 0.3);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #ffb74d;
      line-height: 1.5;
    }

    /* قسم قائمة الحلقات */
    .episodes-section {
      background: #14161f;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      max-height: 600px;
    }

    .episodes-section h3 {
      font-size: 1.1rem;
      margin-bottom: 15px;
      color: #aaa;
      border-bottom: 1px solid #232738;
      padding-bottom: 10px;
    }

    /* شبكة الحلقات */
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding-left: 5px;
    }

    .episodes-grid::-webkit-scrollbar {
      width: 6px;
    }
    .episodes-grid::-webkit-scrollbar-thumb {
      background: #2a2e42;
      border-radius: 4px;
    }

    .episode-btn {
      background: #1f2333;
      border: 1px solid #2a2e42;
      color: #ddd;
      padding: 12px 5px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      user-select: none;
    }

    .episode-btn:hover {
      background: #2b3147;
      color: #fff;
    }

    .episode-btn.active {
      background: #00e676;
      color: #0b0c10;
      font-weight: bold;
      border-color: #00e676;
    }
  </style>
</head>
<body>

  <header>
    <h1 id="series-title">اسم المسلسل</h1>
    <span style="color: #777; font-size: 0.9rem;">Elwazer Cinema</span>
  </header>

  <div class="container">
    
    <!-- مشغل الفيديو -->
    <div class="video-section">
      <div class="video-wrapper">
        <video id="player" playsinline controls referrerpolicy="no-referrer"></video>
      </div>

      <div class="video-info">
        <div class="video-info-top">
          <h2 id="current-episode-text">اختر حلقة للتشغيل</h2>
          <div class="actions-btns">
            <button class="action-btn copy-btn" id="copy-btn">نسخ الرابط</button>
            <a id="vlc-btn" href="#" class="action-btn vlc-btn" target="_blank">تشغيل في VLC / تطبيق خارجي</a>
          </div>
        </div>

        <div class="alert-box">
          ⚠️ <strong>ملاحظة:</strong> إذا ظهرت شاشة سوداء أو لم يبدأ الفيديو داخل المتصفح بسبب تشفير السيرفر، اضغط على زر <strong>(تشغيل في VLC)</strong> وسيعمل معك البث بجودته الكاملة بدون تقطيع.
        </div>
      </div>
    </div>

    <!-- قائمة الحلقات -->
    <div class="episodes-section">
      <h3>قائمة الحلقات</h3>
      <div class="episodes-grid" id="episodes-container"></div>
    </div>

  </div>

  <!-- مكتبات التشغيل -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    /* ========================================================
       بيانات المسلسل والحلقات الخاصة بك (كما هي دون تعديل)
       ======================================================== */
    const SERIES_NAME = "مسلسل lioness - الموسم الأول";

    const EPISODES = [
      {
        number: 1,
        title: "الحلقة 1",
        url: "http://shoftv.net:80/series/277468210/118457482/206784.mkv"
      },
      {
        number: 2,
        title: "الحلقة 2",
        url: "http://shoftv.net:80/series/277468210/118457482/206785.mkv"
      },
      {
        number: 3,
        title: "الحلقة 3",
        url: "http://shoftv.net:80/series/277468210/118457482/206786.mkv"
      },
      {
        number: 4,
        title: "الحلقة 4",
        url: "http://shoftv.net:80/series/277468210/118457482/206787.mkv"
      },
      {
        number: 5,
        title: "الحلقة 5",
        url: "http://shoftv.net:80/series/277468210/118457482/207465.mkv"
      }
    ];

    /* ========================================================
       كود التشغيل والتحكم
       ======================================================== */
    document.getElementById('series-title').innerText = SERIES_NAME;

    const videoElement = document.getElementById('player');
    const episodeTitleEl = document.getElementById('current-episode-text');
    const vlcBtn = document.getElementById('vlc-btn');
    const copyBtn = document.getElementById('copy-btn');
    const episodesContainer = document.getElementById('episodes-container');

    const player = new Plyr(videoElement, {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
    });

    let activeEpisodeUrl = "";

    function playEpisode(episode) {
      activeEpisodeUrl = episode.url;
      episodeTitleEl.innerText = `${SERIES_NAME} - ${episode.title}`;
      
      // تجهيز رابط VLC المباشر
      vlcBtn.href = `vlc://${episode.url}`;

      // محاولة تشغيل الفيديو داخل الصفحة
      videoElement.src = episode.url;
      videoElement.load();
      videoElement.play().catch(error => {
        console.warn("المتصفح منع التشغيل التلقائي بسبب قيود الأمان HTTP/CORS");
      });
    }

    // زر نسخ الرابط
    copyBtn.addEventListener('click', () => {
      if (activeEpisodeUrl) {
        navigator.clipboard.writeText(activeEpisodeUrl);
        copyBtn.innerText = "تم النسخ ✓";
        setTimeout(() => copyBtn.innerText = "نسخ الرابط", 2000);
      }
    });

    // رسم أزرار الحلقات
    function renderEpisodes() {
      episodesContainer.innerHTML = '';
      EPISODES.forEach((ep, index) => {
        const btn = document.createElement('div');
        btn.className = 'episode-btn' + (index === 0 ? ' active' : '');
        btn.innerText = ep.title;

        btn.addEventListener('click', () => {
          document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          playEpisode(ep);
        });

        episodesContainer.appendChild(btn);
      });

      if (EPISODES.length > 0) {
        playEpisode(EPISODES[0]);
      }
    }

    renderEpisodes();
  </script>
</body>
</html>
