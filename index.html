<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elwazer TV</title>

  <!-- مشغل Plyr الحديث -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #07080b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px 25px;
    }

    header {
      width: 100%;
      max-width: 1450px;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a1d29;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.7rem;
      color: #00e676;
      letter-spacing: 0.5px;
    }

    .brand-tag {
      background: #141722;
      border: 1px solid #232738;
      padding: 5px 12px;
      border-radius: 20px;
      color: #00e676;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .container {
      width: 100%;
      max-width: 1450px;
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 25px;
      align-items: start;
    }

    @media (max-width: 992px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .video-section {
      background: #10121a;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #1e2230;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7);
    }

    .video-wrapper {
      position: relative;
      background: #000;
      width: 100%;
      line-height: 0;
    }

    .video-wrapper .plyr {
      width: 100%;
      height: 100%;
    }

    .video-wrapper video {
      width: 100%;
      height: auto;
      display: block;
    }

    .video-info {
      padding: 15px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #10121a;
      border-top: 1px solid #1c202c;
      line-height: normal;
    }

    .video-info h2 {
      font-size: 1.25rem;
      color: #ffffff;
      font-weight: 600;
    }

    .now-playing-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 230, 118, 0.1);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.25);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }

    .now-playing-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #00e676;
      border-radius: 50%;
      box-shadow: 0 0 8px #00e676;
    }

    .episodes-section {
      background: #10121a;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      border: 1px solid #1e2230;
      max-height: 640px;
    }

    .section-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: #aaa;
    }

    .seasons-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      overflow-x: auto;
      padding-bottom: 6px;
      border-bottom: 1px solid #1e2230;
    }

    .seasons-bar::-webkit-scrollbar {
      height: 4px;
    }
    .seasons-bar::-webkit-scrollbar-thumb {
      background: #252a3b;
      border-radius: 4px;
    }

    .season-tab {
      background: #171a26;
      border: 1px solid #23283b;
      color: #8b92a8;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      white-space: nowrap;
      transition: all 0.2s ease;
      user-select: none;
    }

    .season-tab:hover {
      background: #222738;
      color: #fff;
    }

    .season-tab.active {
      background: #00e676;
      color: #07080b;
      font-weight: bold;
      border-color: #00e676;
      box-shadow: 0 2px 10px rgba(0, 230, 118, 0.2);
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      overflow-y: auto;
      padding-left: 5px;
      max-height: 500px;
    }

    .episodes-grid::-webkit-scrollbar {
      width: 5px;
    }
    .episodes-grid::-webkit-scrollbar-thumb {
      background: #252a3b;
      border-radius: 4px;
    }

    .episode-btn {
      background: #171a26;
      border: 1px solid #23283b;
      color: #cfd3e0;
      padding: 12px 6px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      user-select: none;
    }

    .episode-btn:hover {
      background: #222738;
      color: #fff;
      transform: translateY(-2px);
    }

    .episode-btn.active {
      background: #00e676;
      color: #07080b;
      font-weight: bold;
      border-color: #00e676;
      box-shadow: 0 4px 15px rgba(0, 230, 118, 0.25);
    }
  </style>
</head>
<body>

  <header>
    <h1 id="series-title">اسم المسلسل</h1>
    <span class="brand-tag">Elwazer Cinema HD</span>
  </header>

  <div class="container">
    <div class="video-section">
      <div class="video-wrapper">
        <video id="player" playsinline controls></video>
      </div>

      <div class="video-info">
        <h2 id="current-episode-text">اختر حلقة للتشغيل</h2>
        <span class="now-playing-badge">جاري المشاهدة</span>
      </div>
    </div>

    <div class="episodes-section">
      <h3 class="section-title">المواسم</h3>
      <div class="seasons-bar" id="seasons-container"></div>
      <div class="episodes-grid" id="episodes-container"></div>
    </div>
  </div>

  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    const SERIES_NAME = "مسلسل Lioness";

    const SEASONS = [
      {
        seasonName: "الموسم الأول",
        episodes: [
          { number: 1, title: "الحلقة 1", url: "http://shoftv.net:80/series/277468210/118457482/206784.mkv" },
          { number: 2, title: "الحلقة 2", url: "http://shoftv.net:80/series/277468210/118457482/206785.mkv" },
          { number: 3, title: "الحلقة 3", url: "http://shoftv.net:80/series/277468210/118457482/206786.mkv" },
          { number: 4, title: "الحلقة 4", url: "http://shoftv.net:80/series/277468210/118457482/206787.mkv" },
          { number: 5, title: "الحلقة 5", url: "http://shoftv.net:80/series/277468210/118457482/207465.mkv" },
          { number: 6, title: "الحلقة 6", url: "http://shoftv.net:80/series/277468210/118457482/264183.mkv" },
          { number: 7, title: "الحلقة 7", url: "http://shoftv.net:80/series/277468210/118457482/207625.mkv" },
          { number: 8, title: "الحلقة 8", url: "http://shoftv.net:80/series/277468210/118457482/207831.mkv" }
        ]
      },
      {
        seasonName: "الموسم الثاني",
        episodes: [
          { number: 1, title: "الحلقة 1", url: "http://shoftv.net:80/series/277468210/118457482/277625.mkv" },
          { number: 2, title: "الحلقة 2", url: "http://shoftv.net:80/series/277468210/118457482/277626.mkv" },
          { number: 3, title: "الحلقة 3", url: "http://shoftv.net:80/series/277468210/118457482/277627.mkv" },
          { number: 4, title: "الحلقة 4", url: "http://shoftv.net:80/series/277468210/118457482/277628.mkv" },
          { number: 5, title: "الحلقة 5", url: "http://shoftv.net:80/series/277468210/118457482/277629.mkv" },
          { number: 6, title: "الحلقة 6", url: "http://shoftv.net:80/series/277468210/118457482/277630.mkv" },
          { number: 7, title: "الحلقة 7", url: "http://shoftv.net:80/series/277468210/118457482/277631.mkv" },
          { number: 8, title: "الحلقة 8", url: "http://shoftv.net:80/series/277468210/118457482/277632.mkv" }
        ]
      }
    ];

    document.getElementById('series-title').innerText = SERIES_NAME;

    const videoElement = document.getElementById('player');
    const episodeTitleEl = document.getElementById('current-episode-text');
    const seasonsContainer = document.getElementById('seasons-container');
    const episodesContainer = document.getElementById('episodes-container');

    const player = new Plyr(videoElement, {
      controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen']
    });

    let currentSeasonIndex = 0;

    function playEpisode(seasonName, episode) {
      episodeTitleEl.innerText = `${SERIES_NAME} - ${seasonName} - ${episode.title}`;

      const proxiedUrl = `https://wazer.wazermasr22.workers.dev/?url=${encodeURIComponent(episode.url)}`;

      player.source = {
        type: 'video',
        title: `${seasonName} - ${episode.title}`,
        sources: [
          {
            src: proxiedUrl,
            type: 'video/mp4',
          }
        ]
      };

      player.play().catch(e => {
        console.log("في انتظار بدء التشغيل...");
      });
    }

    function renderEpisodes(seasonIdx, autoPlayFirst = true) {
      episodesContainer.innerHTML = '';
      const currentSeason = SEASONS[seasonIdx];

      if (!currentSeason || !currentSeason.episodes.length) return;

      currentSeason.episodes.forEach((ep, index) => {
        const btn = document.createElement('div');
        btn.className = 'episode-btn' + (index === 0 ? ' active' : '');
        btn.innerText = ep.title;

        btn.addEventListener('click', () => {
          document.querySelectorAll('.episode-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          playEpisode(currentSeason.seasonName, ep);
        });

        episodesContainer.appendChild(btn);
      });

      if (autoPlayFirst && currentSeason.episodes.length > 0) {
        playEpisode(currentSeason.seasonName, currentSeason.episodes[0]);
      }
    }

    function renderSeasons() {
      seasonsContainer.innerHTML = '';
      SEASONS.forEach((season, index) => {
        const tab = document.createElement('div');
        tab.className = 'season-tab' + (index === currentSeasonIndex ? ' active' : '');
        tab.innerText = season.seasonName;

        tab.addEventListener('click', () => {
          if (currentSeasonIndex === index) return;
          currentSeasonIndex = index;

          document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');

          renderEpisodes(currentSeasonIndex, true);
        });

        seasonsContainer.appendChild(tab);
      });

      renderEpisodes(0, true);
    }

    renderSeasons();
  </script>
</body>
</html>
